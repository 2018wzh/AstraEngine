name: ci

on:
  push:
  pull_request:

jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        workspace: [engine, emu]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev clang cmake
      - name: Check product workspace
        run: cargo xtask check --workspace ${{ matrix.workspace }}

  ffmpeg:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build optional FFmpeg tests
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .tmp/vcpkg
          .tmp/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          .tmp/vcpkg/vcpkg.exe install ffmpeg:x64-windows --clean-after-build
          python Tools/configure_ci_ffmpeg.py
      - name: Validate explicit decoder
        run: cargo test -p astra-media --features ffmpeg-vcpkg
