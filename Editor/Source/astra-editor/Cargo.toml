[package]
name = "astra-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
astra-asset = { path = "../../../Engine/Source/Runtime/astra-asset" }
astra-cook = { path = "../../../Engine/Source/Developer/astra-cook" }
astra-core = { path = "../../../Engine/Source/Runtime/astra-core" }
astra-vn-editor = { path = "../../../Engine/Source/Modules/AstraVN/astra-vn-editor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
astra-ui-core = { path = "../../../Engine/Source/Runtime/astra-ui-core" }
astra-vn-policy = { path = "../../../Engine/Source/Modules/AstraVN/astra-vn-policy" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rmcp = { version = "=3.4.0", features = ["transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
agent-client-protocol = "=2.2.0"
gpui = "=0.2.2"
gpui-component = "=0.5.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
