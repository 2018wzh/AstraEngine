schema = "astra.dynamic_artifact_policy.v1"
windows_rust_dylib_export_budget = 60000

[documentation]
required_command = "python Tools/check_dynamic_artifacts.py"
paths = [
    "Docs/adr/0018-windows-dynamic-artifact-governance.md",
    "Docs/contracts/plugin-abi.md",
    "Docs/implementation/workspace-blueprint.md",
    "Docs/status/stages/stage-test-matrix.md",
]

[[artifact]]
package = "astra-engine"
target = "astra_engine"
crate_types = ["rlib", "dylib"]
role = "rust_compatibility_facade"
owner = "EngineCore"
platforms = ["windows", "linux", "macos"]
publishable = true
windows_export_budget = 60000
audit_windows_exports = true
allowed_workspace_dependencies = ["astra-core", "astra-package", "astra-plugin", "astra-runtime"]

[[artifact]]
package = "astra-vn"
target = "astra_vn"
crate_types = ["rlib", "dylib"]
role = "rust_compatibility_facade"
owner = "AstraVN"
platforms = ["windows", "linux", "macos"]
publishable = true
windows_export_budget = 60000
audit_windows_exports = true
allowed_workspace_dependencies = [
    "astra-vn-core",
    "astra-vn-presentation",
    "astra-vn-script",
    "astra-vn-system",
]

[[artifact]]
package = "astra-player-android"
