[package]
name = "astra-emu-family-support"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
astra-core = { path = "../../../../Engine/Source/Runtime/astra-core" }
astra-byte-source = { path = "../../../../Engine/Source/Runtime/astra-byte-source" }
astra-emu-family-api = { path = "../../FamilyApi/astra-emu-family-api" }
astra-emu-family-core = { path = "../../FamilyCore/astra-emu-family-core" }
astra-media = { path = "../../../../Engine/Source/Runtime/astra-media" }
astra-platform = { path = "../../../../Engine/Source/Platform/astra-platform" }
blowfish.workspace = true
crc32fast = "1.5"
encoding_rs.workspace = true
flate2.workspace = true
fs2 = "0.4"
globset = "0.4"
lru.workspace = true
mlua.workspace = true
rc4.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
astra-platform-linux = { path = "../../../../Engine/Source/Platform/astra-platform-linux" }
fuser.workspace = true
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
astra-platform-windows = { path = "../../../../Engine/Source/Platform/astra-platform-windows" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[target.'cfg(target_os = "macos")'.dependencies]
astra-platform-macos = { path = "../../../../Engine/Source/Platform/astra-platform-macos" }

[dev-dependencies]
tempfile.workspace = true
