[package]
name = "astra-emu-artemis"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
abi_stable.workspace = true
astra-emu-family-api = { path = "../../FamilyApi/astra-emu-family-api", features = ["diagnostic-bridge"] }
art3m1s-core = { path = "../../../ThirdParty/art3m1s-core", default-features = false, features = [
    "ffmpeg",
] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
astra-emu-sdk = { path = "../../SDK/astra-emu-sdk", default-features = false, features = ["audio"] }
kira.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
art3m1s-core = { path = "../../../ThirdParty/art3m1s-core", default-features = false, features = ["vulkan-backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
art3m1s-core = { path = "../../../ThirdParty/art3m1s-core", default-features = false, features = ["metal-backend"] }

[dev-dependencies]
env_logger = "0.11"
image = { workspace = true, features = ["png"] }
tempfile.workspace = true

[package.metadata.astra]
upstream = "https://github.com/Alphaly2K/art3m1s-core"
upstream_revision = "ad90a62cb192b119b7cf8589aa7f87a94bd747c8"
hosted_fork = "https://github.com/2018wzh/art3m1s-core"
hosted_fork_branch = "codex/astra-minimal-native-20261017"
hosted_fork_revision = "ae967d8446fe99b97f6e1df93fb1b61d8ada2040"
license_notice = "THIRD_PARTY_NOTICES.md"
modifications = "MODIFICATIONS.md"
