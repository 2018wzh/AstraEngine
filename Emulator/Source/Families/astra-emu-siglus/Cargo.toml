[package]
name = "astra-emu-siglus"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
abi_stable.workspace = true
astra-emu-family-api = { path = "../../FamilyApi/astra-emu-family-api", features = ["diagnostic-bridge"] }
siglus_scene_vm = { path = "../../../ThirdParty/siglus_rs/crates/siglus_scene_vm", default-features = false, features = ["astra-hosted"] }
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot = "0.12.5"
anyhow = "1"
pollster = "0.3"

[dev-dependencies]
env_logger = "0.11"
tempfile.workspace = true

[package.metadata.astra]
upstream = "https://github.com/xmoezzz/siglus_rs"
