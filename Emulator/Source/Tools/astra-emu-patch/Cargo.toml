[package]
name = "astra-emu-patch"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
astra-byte-source = { path = "../../../../Engine/Source/Runtime/astra-byte-source" }
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
dunce.workspace = true
flate2.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
mlua.workspace = true
encoding_rs.workspace = true
blowfish.workspace = true
rc4.workspace = true
crc32fast = "1.5"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
toml = "1.1"
toml_parser = "=1.1.2"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

