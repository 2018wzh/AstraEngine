[package]
name = "astra-emu-manager"
version = "0.1.0-beta.2"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "astra-emu-manager"
path = "src/bin_main.rs"

[dependencies]
astra-emu-manager-core = { path = "../astra-emu-manager-core" }
astra-emu-manager-ui-slint = { path = "../astra-emu-manager-ui-slint" }
astra-emu-abi = { path = "../../FamilyApi/astra-emu-abi" }
astra-emu-patch = { path = "../../Tools/astra-emu-patch" }
astra-emu-musica-keys = { path = "../../Families/astra-emu-musica-keys" }
mlua.workspace = true
astra-emu-metadata = { path = "../../Providers/astra-emu-metadata" }
astra-emu-translation = { path = "../../Providers/astra-emu-translation" }
astra-observability = { path = "../../../../Engine/Source/Developer/astra-observability" }
astra-media-core = { path = "../../../../Engine/Source/Runtime/astra-media-core" }
clap.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true
naga = { version = "30", features = ["spv-in", "wgsl-out"] }
tokio.workspace = true
directories.workspace = true
pollster.workspace = true
reqwest.workspace = true
semver.workspace = true
parking_lot = "0.12.5"
serde_json.workspace = true
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
sha2.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030"] }
thiserror.workspace = true
tempfile.workspace = true
tracing.workspace = true
url.workspace = true
winit.workspace = true
hassle-rs = "=0.12.0"
wgpu = { version = "30", features = ["static-dxc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
gilrs = { workspace = true, features = ["wgi"] }
rfd.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
astra-emu-rfvp = { path = "../../../ThirdParty/rfvp/crates/astra-emu-rfvp" }

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
crc32fast = "1.5"
flate2.workspace = true
